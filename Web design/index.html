<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Уеб дизайн</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:0 20px}li{margin:12px 0}a{font-size:1.2em}</style></head><body><h1>Уеб дизайн</h1><ul id="list"><li>Зареждане...</li></ul><script>const lessonTitles={"01-Website-Planning.html":"Планиране на уеб сайт","02-Domain-Name-and-Web-Hosting.html":"Урок 2: Избор на име и регистриране на уеб сайт","03-Web-Design-and-Site-Structure.html":"Урок 3: Проектиране и графичен дизайн на уеб сайт","04-Web-Page-Design.html":"Урок 4: Проектиране на уеб страница"};
fetch('https://api.github.com/repos/martin-lift/108/contents/'+encodeURIComponent('Web design')).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(items=>{const list=document.getElementById('list');list.innerHTML='';items.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.html')&&x.name.toLowerCase()!=='index.html').sort((a,b)=>a.name.localeCompare(b.name)).forEach(x=>{const li=document.createElement('li'),a=document.createElement('a');a.href=encodeURIComponent(x.name);a.textContent=lessonTitles[x.name] || 'Урок'; if(!lessonTitles[x.name]){fetch(a.href).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');const heading=doc.querySelector('h1')||doc.querySelector('title');if(heading&&heading.textContent.trim())a.textContent=heading.textContent.trim()}).catch(()=>{});};li.appendChild(a);list.appendChild(li)});if(!list.children.length)list.innerHTML='<li>Няма уроци</li>'}).catch(()=>document.getElementById('list').innerHTML='<li>Съдържанието не може да се зареди</li>');</script></body></html>
