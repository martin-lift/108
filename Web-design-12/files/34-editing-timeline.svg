<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img"><title>Примерна времева линия на видео от 45 секунди</title><desc>Шест последователни видеокадъра, заглавие в началото, финален надпис и два участъка с говор. Звукът и текстовете са подредени по същата времева скала.</desc><rect width="960" height="300" fill="white"/><g fill="#203244" font-family="Arial" font-size="20"><text x="20" y="98">Видео</text><text x="20" y="166">Текст</text><text x="20" y="232">Говор</text><text x="130" y="35">0 сек.</text><text x="854" y="35">45 сек.</text></g><rect x="130" y="65" width="83" height="52" rx="3" fill="#254e70"/><text x="172.5" y="98" text-anchor="middle" font-family="Arial" font-size="20" fill="white">Кадър 1</text><rect x="215" y="65" width="117" height="52" rx="3" fill="#438366"/><text x="274.5" y="98" text-anchor="middle" font-family="Arial" font-size="20" fill="white">Кадър 2</text><rect x="334" y="65" width="117" height="52" rx="3" fill="#596b9a"/><text x="393.5" y="98" text-anchor="middle" font-family="Arial" font-size="20" fill="white">Кадър 3</text><rect x="453" y="65" width="134" height="52" rx="3" fill="#438366"/><text x="521.0" y="98" text-anchor="middle" font-family="Arial" font-size="20" fill="white">Кадър 4</text><rect x="589" y="65" width="151" height="52" rx="3" fill="#596b9a"/><text x="665.5" y="98" text-anchor="middle" font-family="Arial" font-size="20" fill="white">Кадър 5</text><rect x="742" y="65" width="151" height="52" rx="3" fill="#254e70"/><text x="818.5" y="98" text-anchor="middle" font-family="Arial" font-size="20" fill="white">Кадър 6</text><rect x="130" y="135" width="85" height="48" rx="3" fill="#edf4f8" stroke="#254e70"/><rect x="742" y="135" width="153" height="48" rx="3" fill="#edf4f8" stroke="#254e70"/><rect x="215" y="205" width="119" height="48" rx="3" fill="#e6f2ee" stroke="#438366"/><rect x="453" y="205" width="136" height="48" rx="3" fill="#e6f2ee" stroke="#438366"/><g fill="#203244" font-family="Arial" font-size="16" text-anchor="middle"><text x="172" y="164">Заглавие</text><text x="818" y="164">Финален надпис</text><text x="274" y="234">Реплика 1</text><text x="521" y="234">Реплика 2</text></g><path d="M130 270H895" stroke="#8097a6" stroke-width="2"/></svg>