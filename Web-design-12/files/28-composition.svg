<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><title>Два варианта на композиция с дърво</title><desc>Вляво дървото е в центъра. Вдясно е близо до дясната третина. Мрежата разделя кадрите на девет части.</desc><rect width="960" height="360" fill="white"/><g transform="translate(30 60)"><text x="210" y="-20" text-anchor="middle" font-family="Arial" font-size="21" fill="#203244">Централно разположение</text><rect width="420" height="270" rx="8" fill="#e8f1f8"/><path d="M0 180H420V270H0Z" fill="#dce9dd"/><path d="M140 0V270M280 0V270M0 90H420M0 180H420" stroke="#254e70" stroke-width="2" stroke-dasharray="7 5" opacity=".65"/><rect x="201" y="105" width="18" height="105" fill="#80604c"/><circle cx="210" cy="90" r="43" fill="#438366"/><circle cx="186" cy="115" r="28" fill="#438366"/><circle cx="234" cy="115" r="28" fill="#438366"/><path d="M0 180H420" stroke="#657e65" stroke-width="3"/></g><g transform="translate(510 60)"><text x="210" y="-20" text-anchor="middle" font-family="Arial" font-size="21" fill="#203244">Обект до дясната третина</text><rect width="420" height="270" rx="8" fill="#e8f1f8"/><path d="M0 180H420V270H0Z" fill="#dce9dd"/><path d="M140 0V270M280 0V270M0 90H420M0 180H420" stroke="#254e70" stroke-width="2" stroke-dasharray="7 5" opacity=".65"/><rect x="271" y="105" width="18" height="105" fill="#80604c"/><circle cx="280" cy="90" r="43" fill="#438366"/><circle cx="256" cy="115" r="28" fill="#438366"/><circle cx="304" cy="115" r="28" fill="#438366"/><path d="M0 180H420" stroke="#657e65" stroke-width="3"/></g></svg>