<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img"><title>Общ, среден и близък план на дейност</title><desc>Общият план показва мястото и човека, средният се съсредоточава върху човека и действието, а близкият показва ръцете и листа.</desc><defs><g id="scene"><rect width="600" height="360" fill="#e8f1f8"/><path d="M0 290H600V360H0Z" fill="#dce9dd"/><rect x="65" y="180" width="16" height="125" fill="#80604c"/><circle cx="73" cy="150" r="50" fill="#438366"/><circle cx="300" cy="82" r="35" fill="#d4a67e"/><rect x="255" y="119" width="90" height="170" rx="25" fill="#254e70"/><path d="M265 145L225 240L265 258M335 145L375 240L335 258" fill="none" stroke="#254e70" stroke-width="28" stroke-linejoin="round"/><path d="M175 280H430M205 280V355M405 280V355" stroke="#80604c" stroke-width="17"/><rect x="245" y="243" width="110" height="30" rx="3" fill="#fff" stroke="#254e70" stroke-width="3"/><path d="M260 254H335M260 263H320" stroke="#9fb7cc" stroke-width="3"/></g></defs><rect width="960" height="250" fill="white"/><text x="160" y="34" text-anchor="middle" font-family="Arial" font-size="23" fill="#203244">Общ план</text><svg x="20" y="55" width="280" height="168" viewBox="0 0 600 360" overflow="hidden"><use href="#scene"/></svg><rect x="20" y="55" width="280" height="168" fill="none" stroke="#254e70" stroke-width="2"/><text x="480" y="34" text-anchor="middle" font-family="Arial" font-size="23" fill="#203244">Среден план</text><svg x="340" y="55" width="280" height="168" viewBox="100 40 400 240" overflow="hidden"><use href="#scene"/></svg><rect x="340" y="55" width="280" height="168" fill="none" stroke="#254e70" stroke-width="2"/><text x="800" y="34" text-anchor="middle" font-family="Arial" font-size="23" fill="#203244">Близък план</text><svg x="660" y="55" width="280" height="168" viewBox="210 200 180 108" overflow="hidden"><use href="#scene"/></svg><rect x="660" y="55" width="280" height="168" fill="none" stroke="#254e70" stroke-width="2"/></svg>