<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><title>Схема за странична светлина и бял отражател</title><desc>Прозорец вляво осветява предмет в средата. Бял лист вдясно връща част от светлината към сенчестата страна.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#996a12"/></marker></defs><rect width="960" height="360" rx="12" fill="#f5f8fa"/><rect x="70" y="55" width="130" height="220" fill="#d2e9f8" stroke="#254e70" stroke-width="4"/><path d="M135 55V275M70 165H200" stroke="#254e70" stroke-width="4"/><text x="135" y="315" text-anchor="middle" font-family="Arial" font-size="23" fill="#203244">Прозорец</text><rect x="420" y="115" width="130" height="130" rx="12" fill="#438366"/><path d="M485 115H538Q550 115 550 127V233Q550 245 538 245H485Z" fill="#315d4b"/><text x="485" y="315" text-anchor="middle" font-family="Arial" font-size="23" fill="#203244">Предмет</text><rect x="750" y="60" width="80" height="215" fill="white" stroke="#254e70" stroke-width="4"/><text x="790" y="315" text-anchor="middle" font-family="Arial" font-size="23" fill="#203244">Бял лист</text><path d="M230 135H390M230 205H390M720 180H580" stroke="#996a12" stroke-width="4" marker-end="url(#arrow)"/><text x="310" y="95" text-anchor="middle" font-family="Arial" font-size="20" fill="#203244">Светлина</text><text x="660" y="145" text-anchor="middle" font-family="Arial" font-size="20" fill="#203244">Отразена светлина</text></svg>