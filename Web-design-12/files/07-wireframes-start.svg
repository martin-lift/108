<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="2400" height="1300" viewBox="0 0 2400 1300"><title>Работни области за три схеми</title><rect width="2400" height="1300" fill="white"/><g><text x="30" y="45" font-family="Arial" font-size="24" fill="#333">Начална страница — широк изглед</text><rect x="30" y="70" width="850" height="1100" fill="#fafafa" stroke="#888" stroke-dasharray="8 8"/></g><g><text x="930" y="45" font-family="Arial" font-size="24" fill="#333">Начална страница — телефон</text><rect x="930" y="70" width="400" height="1100" fill="#fafafa" stroke="#888" stroke-dasharray="8 8"/></g><g><text x="1380" y="45" font-family="Arial" font-size="24" fill="#333">Вътрешна страница</text><rect x="1380" y="70" width="850" height="1100" fill="#fafafa" stroke="#888" stroke-dasharray="8 8"/></g></svg>